name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared models and existing Spotify regression tests
        run: bash gradlew -PsharedOnly=true :shared:jvmTest :spotify:test --stacktrace

  ipa:
    needs: shared-tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compute build identity
        id: build
        run: bash scripts/ci-build-metadata.sh ios >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test shared code on the iOS simulator
        run: bash gradlew -PsharedOnly=true :shared:iosSimulatorArm64Test --stacktrace
      - name: Compile and package unsigned device app
        env:
          SPOTUI_VERSION: ${{ steps.build.outputs.version }}
          SPOTUI_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          SPOTUI_ARTIFACT_LABEL: ${{ steps.build.outputs.label }}
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Spotui-${{ steps.build.outputs.label }}
          path: build/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
