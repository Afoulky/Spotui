name: Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"
      - name: Run unit tests
        run: bash gradlew :shared:jvmTest :spotify:test :app:testReleaseUnitTest --stacktrace
      # The release variant already uses the repository's shared debug keystore.
      # This produces an installable APK without adding signing secrets to CI.
      - name: Build release APK
        run: bash gradlew :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Android-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Android-test-reports
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            spotify/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
